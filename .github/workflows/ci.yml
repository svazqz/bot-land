name: "Validation"
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  workflow_dispatch: {}
permissions:
  contents: "read"
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true
jobs:
  build:
    name: "Build Bot Land (${{ matrix.component }})"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        component:
          - "client"
          - "service"
          - "providers/telegram"
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: "Set up Node.js"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: "Install pnpm 8"
        run: "npm install --global pnpm@8.15.9"
      - name: "Install and build"
        working-directory: "${{ matrix.component }}"
        run: |
          pnpm install --frozen-lockfile
          pnpm build
  service-tests:
    name: "Service unit and GraphQL integration tests"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 15
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: "Run service tests and coverage in Docker"
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --init \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            node:22-bookworm-slim sh /src/service/tests/container.sh | tee -a "$GITHUB_STEP_SUMMARY"
  client-tests:
    name: "Bot Land headless client tests"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: docker build -f client/tests/browser/Dockerfile -t bot-land-browser client
      - run: docker run --rm --init --network none --shm-size=1g bot-land-browser
