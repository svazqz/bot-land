    </pattern>
    <linearGradient id="accent">
      <stop stop-color="#9BE3DA"/><stop offset="1" stop-color="#72C9C2" stop-opacity=".26"/>
    </linearGradient>
    <clipPath id="corners"><rect x="1" y="1" width="1198" height="258" rx="26"/></clipPath>
  </defs>

