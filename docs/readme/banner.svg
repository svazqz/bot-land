<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="project-title project-description">
  <title id="project-title">Bot Land</title>
  <desc id="project-description">Manage bots from one dashboard.</desc>
  <defs>
    <linearGradient id="background">
      <stop offset="0" stop-color="#121D2C"/>
      <stop offset="1" stop-color="#20384C"/>
